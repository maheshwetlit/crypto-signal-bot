name: Hermes Daily Signal Report

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  daily-report:
    runs-on: ubuntu-latest
    env:
      HERMESBOT: ${{ secrets.HERMESCRYPTOTRADINGBOT }}
      HERMES_CHAT_ID: ${{ secrets.HERMES_TELEGRAM_CHAT_ID }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install requests
      - name: Run Daily Report
        run: python hermes_daily_report.py
      - name: Notify status
        if: success() || failure()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            MSG="Hermes Daily Signal Report generated and sent to channel"
          else
            MSG="Hermes Daily Signal Report FAILED - check Actions log"
          fi
          curl -s -X POST https://api.telegram.org/bot${{ secrets.HERMESCRYPTOTRADINGBOT }}/sendMessage \
            -d chat_id=${{ secrets.HERMES_TELEGRAM_CHAT_ID }} \
            -d text="${MSG}" \
            -d parse_mode=HTML \
            -d disable_notification=true \
            > /dev/null
