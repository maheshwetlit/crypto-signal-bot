name: Hermes Signal Validator
on:
 schedule:
 # Every 5 min via staggered triggers (GitHub free tier)
 - cron: '0,5,10,15,20,25,30,35,40,45,50,55 * * * *'
 workflow_dispatch:
permissions:
 contents: write
jobs:
 validate-signals:
 runs-on: ubuntu-latest
 env:
 HERMESBOT: ${{ secrets.HERMESCRYPTOTRADINGBOT }}
 HERMES_CHAT_ID: ${{ secrets.HERMES_CHAT_ID }}
 steps:
 - name: Checkout code
 uses: actions/checkout@v5
 with:
 token: ${{ secrets.GITHUB_TOKEN }}
 persist-credentials: true
 - name: Set up Python
 uses: actions/setup-python@v5
 with:
 python-version: '3.10'
 - name: Install dependencies
 run: pip install requests
 - name: Run Hermes Validator
 run: python hermes_validator.py
 - name: Commit updated signals_log.json
 if: success() || failure()
 run: |
 git config --local user.email "action@github.com"
 git config --local user.name "GitHub Action"
 git add signals_log.json || true
 git diff --staged --quiet || git commit -m "auto: update signals_log.json [validator]"
 git pull --rebase origin main || true
 git push || true
 - name: Notify status
 if: success() || failure()
 run: |
 if [ "${{ job.status }}" = "success" ]; then
 MSG="Hermes Validator run succeeded"
 else
 MSG="Hermes Validator run FAILED - check Actions log"
 fi
 curl -s -X POST https://api.telegram.org/bot${{ secrets.HERMESCRYPTOTRADINGBOT }}/sendMessage \
 -d chat_id=${{ secrets.HERMES_CHAT_ID }} \
 -d text="${MSG}" \
 -d parse_mode=HTML \
 -d disable_notification=true \
 > /dev/null
