name: NFI Crypto Bot

on:
  schedule:
    - cron: '*/10 * * * *'  # every 10 minutes
  workflow_dispatch:  # manual trigger

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true
          fetch-depth: 0
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install ccxt pandas numpy requests
      
      - name: Run NFI bot
        run: python crypto_signal_bot.py
      
      - name: Commit and push results
        run: |
          git config user.name "NFI Bot"
          git config user.email "bot@nfibot"
          git add signals_log.json
          git diff --cached --quiet || git commit -m "Bot scan: $(date -u +%Y-%m-%dT%H:%M:%S)"
          git pull --rebase origin main || true
          git push origin main
