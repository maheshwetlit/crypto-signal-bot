name: Backtest strategy
on:
  workflow_dispatch:
    inputs:
      days:
        description: "History length in days"
        default: "180"
      pairs:
        description: "Number of most-liquid KuCoin pairs"
        default: "40"
  push:
    branches: [main, strategy-v11]
    paths: ["strategy.py", "backtest.py"]
permissions:
  contents: write
concurrency:
  group: backtest-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Cache candle data
        uses: actions/cache@v4
        with:
          path: backtest_cache
          key: candles-${{ inputs.days || '180' }}-${{ inputs.pairs || '40' }}-${{ github.run_id }}
          restore-keys: candles-${{ inputs.days || '180' }}-${{ inputs.pairs || '40' }}-
      - name: Run backtest
        run: python backtest.py --days ${{ inputs.days || '180' }} --pairs ${{ inputs.pairs || '40' }}
      - name: Job summary
        if: always()
        run: test -f backtest_results/report.md && cat backtest_results/report.md >> $GITHUB_STEP_SUMMARY || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backtest-results
          path: backtest_results/
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backtest_results/report.md backtest_results/summary.json
          git diff --cached --quiet || git commit -m "Backtest report [skip ci]"
          for i in 1 2 3; do git push && break || { sleep 5; git pull --rebase origin ${GITHUB_REF_NAME}; }; done
