name: Crypto Signal Bot

on:
  schedule:
    - cron: '*/10 * * * *'  # ✅ FIXED: was '*/5' → now '*/10' (every 10 minutes)
                              # NOTE: GitHub may throttle on free repos — use cron-job.org as backup:
                              # POST https://api.github.com/repos/maheshwetlit/crypto-signal-bot/dispatches
                              # Header: Authorization: Bearer <YOUR_GITHUB_PAT>
                              # Body: {"event_type":"run-bot"}
  workflow_dispatch:
  repository_dispatch:
    types: [run-bot]

permissions:
  contents: read

jobs:
  run-bot:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python crypto_signal_bot.py
